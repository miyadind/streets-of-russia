<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Streets of Russia</title>
  <style>
    body { margin:0; min-height:100vh; background:#090909; color:#f4f1ea; font-family:Arial,Helvetica,sans-serif; }
    main { width:min(900px, calc(100% - 32px)); margin:0 auto; padding:48px 0; }
    h1 { color:#f2c46d; font-size:48px; text-transform:uppercase; }
    .panel { margin:22px 0; padding:22px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <main>
    <h1>Поддержать тех, кто борется</h1>
    <section class="panel">
      <p>Страница поддержки будет оформлена отдельными карточками и предупреждениями перед внешними ссылками.</p>
    </section>
  </main>
</body>
</html>
